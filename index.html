<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BIMS</title>
  <link rel="icon" href="assets/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
</head>

<body>
  <!-- BIMS prototype: each <template id="tpl-…"> below is one screen. Text and data live in assets/app.js. -->
  <div id="app"></div>
  <nav id="pg" aria-label="Prototype pages">
    <div id="pg-list" hidden></div>
    <button type="button" id="pg-toggle" aria-expanded="false" aria-controls="pg-list"><svg width="18" height="18"
        viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 3h7v7H3z M14 3h7v7h-7z M14 14h7v7h-7z M3 14h7v7H3z" fill="none" stroke="currentColor"
          stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg><span>Pages</span></button>
  </nav>
  <template id="tpl-Main">

    <div
      style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1D1D1F; background: #FFFFFF; min-height: 100vh;">

      <header style="background: #FFFFFF; border-bottom: 1px solid #E6E6EA;">
        <nav aria-label="Main"
          style="max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px;">
          <a href="#top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1D1D1F;">
            <img src="__LOGO__" alt="" width="48" height="48"
              style="width: 48px; height: 48px; object-fit: contain; border-radius: 10px; background: #FFFFFF;">
            <span style="font-size: 19px; font-weight: 800; letter-spacing: 0.04em;">BIMS</span>
          </a>
          <div
            style="display: flex; flex-wrap: wrap; gap: 4px 24px; flex: 1 1 320px; font-size: 15px; font-weight: 500;">
            <a href="#features" style="color: #1D1D1F; text-decoration: none; padding: 10px 0;">{{t.navFeatures}}</a>
            <a href="#roles" style="color: #1D1D1F; text-decoration: none; padding: 10px 0;">{{t.navRoles}}</a>
            <a href="#how" style="color: #1D1D1F; text-decoration: none; padding: 10px 0;">{{t.navHow}}</a>
            <a href="#pricing" style="color: #1D1D1F; text-decoration: none; padding: 10px 0;">{{t.navPricing}}</a>
            <a href="#faq" style="color: #1D1D1F; text-decoration: none; padding: 10px 0;">FAQ</a>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
            <div role="group" aria-label="Language / Bahasa"
              style="display: flex; gap: 2px; padding: 3px; border: 1.5px solid #1D1D1F; border-radius: 999px;">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"
                style="flex: none; align-self: center; margin: 0 4px 0 8px;">
                <path
                  d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M3 12h18 M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9 M12 3c-2.5 2.5-3.8 5.5-3.8 9s1.3 6.5 3.8 9"
                  fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                </path>
              </svg><button type="button" onClick="{{setEn}}" aria-pressed="{{isEn}}" style="{{enBtn}}">EN</button>
              <button type="button" onClick="{{setId}}" aria-pressed="{{isId}}" style="{{idBtn}}">ID</button>
            </div>
            <a href="Login.dc.html"
              style="display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 10px; color: #1D1D1F; text-decoration: none; font-weight: 600; font-size: 15px;">{{t.login}}</a>
            <a href="Register.dc.html"
              style="display: inline-flex; align-items: center; height: 44px; padding: 0 20px; border-radius: 10px; background: #C8102E; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 15px;">{{t.register}}</a>
          </div>
        </nav>
      </header>

      <section id="top"
        style="max-width: 1200px; margin: 0 auto; padding: 72px 24px 64px; display: flex; flex-wrap: wrap; gap: 56px; align-items: center;">
        <div style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 24px;">
          <span
            style="align-self: flex-start; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9E0B22; background: #FDECEE; padding: 8px 12px; border-radius: 6px;">{{t.eyebrow}}</span>
          <h1 style="margin: 0; font-size: 58px; line-height: 1.05; font-weight: 800; letter-spacing: -0.035em;">
            {{t.heroA}} <span
              style="background: linear-gradient(transparent 58%, #E3B53B 58%, #E3B53B 92%, transparent 92%);">{{t.heroB}}</span>
          </h1>
          <p style="margin: 0; font-size: 19px; line-height: 1.6; color: #4A4A55; max-width: 540px;">{{t.heroSub}}</p>
          <div style="display: flex; flex-wrap: wrap; gap: 12px;">
            <a href="Register.dc.html"
              style="display: inline-flex; align-items: center; height: 52px; padding: 0 26px; border-radius: 12px; background: #C8102E; color: #FFFFFF; text-decoration: none; font-weight: 700; font-size: 16px;">{{t.ctaPrimary}}<svg
                width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-left: 10px;">
                <path d="M5 12h14 M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2"
                  stroke-linecap="round" stroke-linejoin="round"></path>
              </svg></a>
            <a href="Login.dc.html"
              style="display: inline-flex; align-items: center; height: 52px; padding: 0 26px; border-radius: 12px; border: 1.5px solid #1D1D1F; color: #1D1D1F; text-decoration: none; font-weight: 700; font-size: 16px;">{{t.ctaSecondary}}</a>
          </div>
          <ul
            style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; color: #4A4A55;">
            <template data-sc-for list="{{t.heroChecks}}" as="c" hint-placeholder-count="3">
              <li style="display: flex; align-items: center; gap: 8px;"><svg width="18" height="18" viewBox="0 0 18 18"
                  aria-hidden="true">
                  <circle cx="9" cy="9" r="8" fill="#FDECEE"></circle>
                  <path d="M5.5 9.2l2.3 2.3 4.7-4.9" fill="none" stroke="#C8102E" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>{{c}}</li>
            </template>
          </ul>
        </div>

        <div style="flex: 1 1 440px; min-width: 0; position: relative;">
          <div
            style="background: #FFFFFF; border: 1px solid #E6E6EA; border-radius: 20px; box-shadow: 0 24px 60px rgba(20,33,61,0.12); overflow: hidden;">
            <div
              style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; background: #C8102E; color: #FFFFFF;">
              <div style="display: flex; flex-direction: column; gap: 2px;">
                <span
                  style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #FFE3E7;">{{t.mockTenant}}</span>
                <span style="font-weight: 700; font-size: 16px;">Bimbel Cahaya Ilmu</span>
              </div>
              <span
                style="font-size: 12px; font-weight: 700; background: #FFFFFF; color: #C8102E; padding: 6px 10px; border-radius: 999px;">{{t.mockActive}}</span>
            </div>
            <div style="padding: 20px; display: flex; flex-direction: column; gap: 16px;">
              <div
                style="font-size: 13px; font-weight: 700; color: #5F6368; text-transform: uppercase; letter-spacing: 0.06em;">
                {{t.mockToday}}</div>
              <template data-sc-for list="{{mockSchedule}}" as="s" hint-placeholder-count="3">
                <div
                  style="display: flex; align-items: center; gap: 14px; padding: 12px 14px; border: 1px solid #ECECF0; border-radius: 12px;">
                  <span
                    style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; color: #9E0B22; width: 92px;">{{s.time}}</span>
                  <div style="display: flex; flex-direction: column; gap: 2px; flex: 1;">
                    <span style="font-weight: 700; font-size: 15px;">{{s.subject}}</span>
                    <span style="font-size: 13px; color: #5F6368;">{{s.who}}</span>
                  </div>
                </div>
              </template>
              <div
                style="display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 14px; background: #FCEFC9;">
                <div style="display: flex; flex-direction: column; gap: 4px; flex: 1;">
                  <span
                    style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: #6B4A00;">CBT</span>
                  <span style="font-weight: 700; font-size: 15px;">{{t.mockExam}}</span>
                  <span style="font-size: 13px; color: #4A3A12;">{{t.mockExamMeta}}</span>
                </div>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600;">59:41</span>
              </div>
            </div>
          </div>
          <div
            style="position: absolute; right: -12px; bottom: -28px; background: #FFFFFF; border: 1px solid #E6E6EA; border-radius: 14px; padding: 14px 18px; box-shadow: 0 12px 30px rgba(20,33,61,0.12); display: flex; align-items: center; gap: 12px;">
            <span
              style="font-family: 'IBM Plex Mono', monospace; font-size: 28px; font-weight: 600; color: #C8102E;">85</span>
            <span style="font-size: 13px; line-height: 1.35; color: #4A4A55; max-width: 140px;">{{t.mockScore}}</span>
          </div>
        </div>
      </section>

      <section aria-labelledby="problem-h" style="background: #C8102E; color: #FFFFFF;">
        <div
          style="max-width: 1200px; margin: 0 auto; padding: 64px 24px; display: flex; flex-direction: column; gap: 32px;">
          <h2 id="problem-h"
            style="margin: 0; font-size: 34px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em; max-width: 720px;">
            {{t.problemTitle}}</h2>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px;">
            <template data-sc-for list="{{t.problems}}" as="p" hint-placeholder-count="3">
              <div
                style="display: flex; flex-direction: column; gap: 14px; padding: 24px; border: 1px solid #E04A5F; border-radius: 16px;">
                <span
                  style="font-size: 14px; color: #FFE3E7; text-decoration: line-through; text-decoration-color: #E3B53B;">{{p.before}}</span>
                <span style="font-size: 18px; font-weight: 700; line-height: 1.4;">{{p.after}}</span>
              </div>
            </template>
          </div>
        </div>
      </section>

      <section id="features" aria-labelledby="features-h"
        style="max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px;">
        <div style="display: flex; flex-direction: column; gap: 12px; max-width: 680px;">
          <span
            style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9E0B22;">{{t.featEyebrow}}</span>
          <h2 id="features-h"
            style="margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.025em;">
            {{t.featTitle}}</h2>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px;">
          <template data-sc-for list="{{features}}" as="f" hint-placeholder-count="6">
            <article
              style="background: #FFFFFF; border: 1px solid #E6E6EA; border-radius: 18px; padding: 28px; display: flex; flex-direction: column; gap: 12px;">
              <span
                style="width: 52px; height: 52px; border-radius: 14px; background: #FDECEE; color: #C8102E; display: flex; align-items: center; justify-content: center;"><svg
                  width="26" height="26" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="{{f.icon}}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round"></path>
                </svg></span>
              <h3 style="margin: 0; font-size: 20px; font-weight: 700;">{{f.title}}</h3>
              <p style="margin: 0; font-size: 15px; line-height: 1.6; color: #4A4A55;">{{f.body}}</p>
            </article>
          </template>
        </div>
      </section>

      <section id="roles" aria-labelledby="roles-h"
        style="background: #FFFFFF; border-top: 1px solid #E6E6EA; border-bottom: 1px solid #E6E6EA;">
        <div
          style="max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px;">
          <div style="display: flex; flex-direction: column; gap: 12px; max-width: 680px;">
            <span
              style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9E0B22;">{{t.rolesEyebrow}}</span>
            <h2 id="roles-h"
              style="margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.025em;">
              {{t.rolesTitle}}</h2>
          </div>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;">
            <template data-sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
              <div
                style="display: flex; flex-direction: column; gap: 14px; padding: 24px; border-radius: 16px; background: #F7F7F8; border-top: 3px solid #C8102E;">
                <div style="display: flex; align-items: center; gap: 12px;"><span
                    style="width: 44px; height: 44px; border-radius: 12px; background: #FFFFFF; color: #C8102E; border: 1px solid #E6E6EA; display: flex; align-items: center; justify-content: center; flex: none;"><svg
                      width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                      <path d="{{r.icon}}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round"></path>
                    </svg></span><span style="font-size: 18px; font-weight: 800;">{{r.name}}</span></div>
                <ul
                  style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5; color: #4A4A55;">
                  <template data-sc-for list="{{r.can}}" as="c" hint-placeholder-count="3">
                    <li>{{c}}</li>
                  </template>
                </ul>
              </div>
            </template>
          </div>
        </div>
      </section>

      <section id="how" aria-labelledby="how-h"
        style="max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px;">
        <h2 id="how-h"
          style="margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.025em;">
          {{t.howTitle}}</h2>
        <ol
          style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
          <template data-sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
            <li
              style="display: flex; flex-direction: column; gap: 12px; padding-top: 20px; border-top: 3px solid #1D1D1F;">
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;"><span
                  style="font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 600; color: #C8102E;">{{s.n}}</span><span
                  style="width: 44px; height: 44px; border-radius: 12px; background: #FBF4DE; color: #8A6A10; display: flex; align-items: center; justify-content: center;"><svg
                    width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="{{s.icon}}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round"></path>
                  </svg></span></div>
              <span style="font-size: 20px; font-weight: 700;">{{s.title}}</span>
              <span style="font-size: 15px; line-height: 1.6; color: #4A4A55;">{{s.body}}</span>
            </li>
          </template>
        </ol>
      </section>

      <section id="pricing" aria-labelledby="pricing-h" style="background: #FDECEE;">
        <div
          style="max-width: 1200px; margin: 0 auto; padding: 88px 24px; display: flex; flex-direction: column; gap: 40px;">
          <div style="display: flex; flex-direction: column; gap: 12px; max-width: 680px;">
            <h2 id="pricing-h"
              style="margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.025em;">
              {{t.priceTitle}}</h2>
            <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #3A3A44;">{{t.priceSub}}</p>
          </div>
          <div
            style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; align-items: stretch;">
            <template data-sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
              <div style="{{p.card}}">
                <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                  <span style="font-size: 20px; font-weight: 800;">{{p.name}}</span>
                  <template data-sc-if value="{{p.featured}}" hint-placeholder-val="{{false}}"><span
                      style="font-size: 12px; font-weight: 700; background: #E3B53B; color: #1D1D1F; padding: 6px 10px; border-radius: 999px;">{{t.popular}}</span></template>
                </div>
                <div style="display: flex; align-items: baseline; gap: 6px;">
                  <span
                    style="font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600;">[PRICE]</span>
                  <span style="font-size: 14px; opacity: 0.8;">{{t.perMonth}}</span>
                </div>
                <span style="font-size: 14px; font-weight: 600;">{{p.users}}</span>
                <ul
                  style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; line-height: 1.5;">
                  <template data-sc-for list="{{p.items}}" as="i" hint-placeholder-count="3">
                    <li>{{i}}</li>
                  </template>
                </ul>
                <a href="Register.dc.html" style="{{p.btn}}">{{t.choosePlan}}</a>
              </div>
            </template>
          </div>
          <p style="margin: 0; font-size: 14px; color: #3A3A44;">{{t.priceNote}}</p>
        </div>
      </section>

      <section aria-labelledby="trust-h"
        style="max-width: 1200px; margin: 0 auto; padding: 72px 24px; display: flex; flex-wrap: wrap; gap: 40px;">
        <h2 id="trust-h"
          style="margin: 0; font-size: 30px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em; flex: 1 1 300px;">
          {{t.trustTitle}}</h2>
        <div
          style="flex: 2 1 560px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px 32px;">
          <template data-sc-for list="{{t.trust}}" as="x" hint-placeholder-count="4">
            <div style="display: flex; gap: 12px;">
              <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true" style="flex: none; margin-top: 2px;">
                <path d="M11 2l7 3v5.5c0 4.4-3 7.8-7 9.5-4-1.7-7-5.1-7-9.5V5z" fill="none" stroke="#C8102E"
                  stroke-width="1.8" stroke-linejoin="round"></path>
                <path d="M7.8 11l2.2 2.2 4.2-4.4" fill="none" stroke="#C8102E" stroke-width="1.8" stroke-linecap="round"
                  stroke-linejoin="round"></path>
              </svg>
              <div style="display: flex; flex-direction: column; gap: 4px;"><span
                  style="font-weight: 700; font-size: 16px;">{{x.title}}</span><span
                  style="font-size: 14px; line-height: 1.55; color: #4A4A55;">{{x.body}}</span></div>
            </div>
          </template>
        </div>
      </section>

      <section id="faq" aria-labelledby="faq-h" style="background: #FFFFFF; border-top: 1px solid #E6E6EA;">
        <div
          style="max-width: 860px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 24px;">
          <h2 id="faq-h" style="margin: 0; font-size: 36px; font-weight: 800; letter-spacing: -0.02em;">{{t.faqTitle}}
          </h2>
          <template data-sc-for list="{{t.faq}}" as="q" hint-placeholder-count="4">
            <details style="border-bottom: 1px solid #E6E6EA; padding: 18px 0;">
              <summary style="cursor: pointer; font-size: 18px; font-weight: 700; min-height: 28px;">{{q.q}}</summary>
              <p style="margin: 12px 0 0; font-size: 15px; line-height: 1.65; color: #4A4A55;">{{q.a}}</p>
            </details>
          </template>
        </div>
      </section>

      <section style="background: #C8102E; color: #FFFFFF;">
        <div
          style="max-width: 1200px; margin: 0 auto; padding: 72px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 24px;">
          <h2
            style="margin: 0; font-size: 36px; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em; max-width: 640px;">
            {{t.finalTitle}}</h2>
          <a href="Register.dc.html"
            style="display: inline-flex; align-items: center; height: 52px; padding: 0 26px; border-radius: 12px; background: #E3B53B; color: #1D1D1F; text-decoration: none; font-weight: 800; font-size: 16px;">{{t.ctaPrimary}}<svg
              width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" style="flex: none; margin-left: 10px;">
              <path d="M5 12h14 M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round"></path>
            </svg></a>
        </div>
      </section>

      <footer
        style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 48px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; font-size: 14px; color: #5F6368;">
        <span><strong style="color: #1D1D1F;">BIMS</strong> — Bimbel Multi Tenant SaaS</span>
        <span>{{t.footer}}</span>
      </footer>
    </div>
  </template>
  <template id="tpl-Register">

    <div
      style="font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1D1D1F; background: #F7F7F8; min-height: 100vh;">
      <header style="background: #F7F7F8; border-bottom: 1px solid #E6E6EA;">
        <div
          style="max-width: 1100px; margin: 0 auto; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px;">
          <a href="Main.dc.html"
            style="display: flex; align-items: center; gap: 10px; color: #1D1D1F; text-decoration: none;">
            <img src="__LOGO__" alt="" width="44" height="44"
              style="width: 44px; height: 44px; object-fit: contain; border-radius: 10px; background: #FFFFFF;">

        <div style="display: flex; flex-direction: column; gap: 10px; max-width: 820px;">
          <span
            style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9E0B22;">Referensi
            desain · SRS Tabel IVa</span>
          <h1 style="margin: 0; font-size: 40px; line-height: 1.15; font-weight: 800; letter-spacing: -0.025em;">Setiap
            peran hanya melihat menu dan data yang menjadi haknya</h1>
          <p style="margin: 0; font-size: 16px; line-height: 1.6; color: #4A4A55;">Menu yang bukan hak suatu peran tidak
            ditampilkan. Server tetap memeriksa peran dan tenant di setiap permintaan, sehingga akses langsung lewat URL
            berakhir di halaman Akses ditolak (403).</p>
        </div>

        <section aria-labelledby="mx-h"
          style="background: #FFFFFF; border: 1px solid #E6E6EA; border-radius: 18px; overflow: hidden;">
          <h2 id="mx-h"
            style="margin: 0; padding: 20px 24px; font-size: 19px; font-weight: 800; border-bottom: 1px solid #ECECF0;">
            Matriks hak akses</h2>
          <div style="overflow-x: auto;">
            <table style="width: 100%; min-width: 880px; border-collapse: collapse; font-size: 14px;">
              <thead>
                <tr style="text-align: left; background: #C8102E; color: #FFFFFF;">
                  <th style="padding: 14px 24px; font-weight: 700;">Fungsi</th>
                  <th style="padding: 14px 12px; font-weight: 700;">Super Admin</th>
                  <th style="padding: 14px 12px; font-weight: 700;">Admin Bimbel</th>
                  <th style="padding: 14px 12px; font-weight: 700;">Tutor</th>
                  <th style="padding: 14px 24px 14px 12px; font-weight: 700;">Siswa</th>
                  <th style="padding: 14px 24px 14px 12px; font-weight: 700;">ER</th>
                </tr>
              </thead>
              <tbody>
                <template data-sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
                  <tr style="border-top: 1px solid #F2F2F5;">
                    <td style="padding: 14px 24px; font-weight: 700;">{{r.fn}}</td>
                    <template data-sc-for list="{{r.cells}}" as="c" hint-placeholder-count="4">
                      <td style="padding: 10px 12px;"><span style="{{c.style}}">{{c.text}}</span></td>
                    </template>
                    <td
                      style="padding: 14px 24px 14px 12px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #5F6368;">
                      {{r.er}}</td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <div
            style="padding: 14px 24px; display: flex; flex-wrap: wrap; gap: 18px; font-size: 13px; color: #4A4A55; border-top: 1px solid #ECECF0;">
            <span style="display: flex; align-items: center; gap: 8px;"><span
                style="width: 14px; height: 14px; border-radius: 4px; background: #C8102E;"></span>Kelola (buat, ubah,
              nonaktifkan)</span>
            <span style="display: flex; align-items: center; gap: 8px;"><span
                style="width: 14px; height: 14px; border-radius: 4px; background: #FDECEE; border: 1px solid #EFA3AE; box-sizing: border-box;"></span>Lihat
              / kerjakan sendiri</span>
            <span style="display: flex; align-items: center; gap: 8px;"><span
                style="width: 14px; height: 14px; border-radius: 4px; background: #F2F2F5;"></span>Tidak ada
              akses</span>
          </div>
        </section>

        <section aria-labelledby="mn-h" style="display: flex; flex-direction: column; gap: 16px;">
          <h2 id="mn-h" style="margin: 0; font-size: 22px; font-weight: 800;">Menu per peran dan layar desainnya</h2>
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px;">
            <template data-sc-for list="{{roles}}" as="r" hint-placeholder-count="4">
              <div
                style="background: #FFFFFF; border: 1px solid #E6E6EA; border-radius: 18px; overflow: hidden; display: flex; flex-direction: column;">
                <div style="{{r.head}}"><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"
                    style="margin-bottom: 6px;">
                    <path d="{{r.icon}}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round"></path>
                  </svg><span style="font-size: 18px; font-weight: 800;">{{r.name}}</span><span
                    style="font-size: 13px; opacity: 0.85;">{{r.scope}}</span></div>
                <ul style="margin: 0; padding: 8px 0; list-style: none; display: flex; flex-direction: column;">
                  <template data-sc-for list="{{r.menus}}" as="m" hint-placeholder-count="5">
                    <li
                      style="display: flex; flex-direction: column; gap: 2px; padding: 10px 20px; border-top: 1px solid #F2F2F5;">
                      <span style="font-weight: 700; font-size: 14px;">{{m.menu}}</span>
                      <span style="font-size: 12px; color: #5F6368;">{{m.does}}</span>
                      <a href="{{m.href}}"
                        style="font-family: 'IBM Plex Mono', monospace; font-size: 12px;">{{m.screen}}</a>
                    </li>
                  </template>
                </ul>
              </div>
            </template>
          </div>
        </section>
      </main>
    </div>
  </template>
  <!-- Supabase SDK & Configuration -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/supabase.js"></script>
  <script src="assets/app.js"></script>
</body>

</html>
